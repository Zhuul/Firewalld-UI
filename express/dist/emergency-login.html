<!DOCTYPE html>
<html>
<head>
    <title>Emergency Login</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <style>
        body { font-family: sans-serif; padding: 40px; }
        div { max-width: 400px; margin: 0 auto; }
        input, button { padding: 8px; margin: 10px 0; width: 100%; }
        button { background: blue; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div>
        <h2>Emergency Login</h2>
        <form id="login">
            <input id="username" placeholder="Username (admin)" /><br>
            <input id="password" type="password" placeholder="Password (admin)" /><br>
            <button type="submit">Login</button>
        </form>
        <div id="result"></div>
    </div>
    <script>
        document.getElementById('login').onsubmit = function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value || 'admin';
            const password = document.getElementById('password').value || 'admin';
            
            fetch('/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    document.getElementById('result').innerHTML = 'Success! Redirecting...';
                    sessionStorage.setItem('token', data.data.token);
                    setTimeout(() => window.location.href = '/', 1000);
                } else {
                    document.getElementById('result').innerHTML = 'Failed: ' + data.message;
                }
            })
            .catch(err => {
                document.getElementById('result').innerHTML = 'Error: ' + err;
            });
        };
    </script>
</body>
</html>
