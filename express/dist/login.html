<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            width: 300px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Login</h2>
        <input type="text" id="username" placeholder="Username" value="admin">
        <input type="password" id="password" placeholder="Password" value="Admin123456@">
        <button id="login-button">Login</button>
        <p id="message"></p>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const message = document.getElementById('message');
            let fingerprint = null;

            // Function to fetch the fingerprint
            const getFingerprint = async () => {
                try {
                    const response = await fetch('/api/getPublicKeyFingerprint');
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    const data = await response.json();
                    if (data.success && data.data.publicKeyFingerprint) {
                        console.log('Fingerprint obtained:', data.data.publicKeyFingerprint);
                        return data.data.publicKeyFingerprint;
                    } else {
                        throw new Error(data.message || 'Failed to retrieve fingerprint.');
                    }
                } catch (error) {
                    console.error('Error getting fingerprint:', error);
                    message.textContent = `Error getting fingerprint: ${error.message}`;
                    return null;
                }
            };

            // Fetch the fingerprint as soon as the page loads
            fingerprint = await getFingerprint();

            // Handle the login button click
            document.getElementById('login-button').addEventListener('click', async () => {
                if (!fingerprint) {
                    message.textContent = 'Could not obtain a security fingerprint. Please refresh and try again.';
                    return;
                }

                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                message.textContent = 'Logging in...';

                try {
                    const response = await fetch('/api/user/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        // The original app sends otherFingerprint, let's mimic that.
                        body: JSON.stringify({ username, password, otherFingerprint: 'authenticated' })
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const data = await response.json();

                    if (data.success && data.data.token) {
                        message.textContent = 'Login successful! Redirecting...';
                        
                        // The Vuex state needs to be structured correctly.
                        // Let's assume the user module holds the token and fingerprint.
                        const vuexState = {
                            user: {
                                token: data.data.token,
                                fingerprint: fingerprint
                            }
                        };
                        
                        // Storing in localStorage for the Vue app to pick up.
                        localStorage.setItem('vuex', JSON.stringify(vuexState));

                        // Redirect to the main application page.
                        window.location.href = '/';
                    } else {
                        throw new Error(data.message || 'Login failed.');
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    message.textContent = `Login failed: ${error.message}`;
                }
            });
        });
    </script>
</body>
</html>
