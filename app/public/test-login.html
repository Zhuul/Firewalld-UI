<!DOCTYPE html>
<html>
<head>
  <title>Test Login</title>
  <script>
    async function login() {
      console.log("Login function called");
      document.getElementById('result').textContent = "Attempting login...";
      
      try {
        console.log("Submitting to /login with credentials:", {
          username: document.getElementById('username').value,
          password: "***HIDDEN***"
        });
        
        // Updated to use the correct endpoint: /login
        const response = await fetch('/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'fingerprint': 'test-fingerprint'
          },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
            // Added these fields that might be expected
            captchaSecret: 'bypass',
            code: '8'
          })
        });
        
        console.log("Response status:", response.status);
        const responseText = await response.text();
        console.log("Raw response:", responseText);
        
        try {
          const data = JSON.parse(responseText);
          document.getElementById('result').textContent = JSON.stringify(data, null, 2);
        } catch (e) {
          document.getElementById('result').textContent = "Failed to parse JSON: " + responseText;
        }
      } catch (error) {
        console.error("Error during login:", error);
        document.getElementById('result').textContent = "Error: " + error.message;
      }
    }
  </script>
</head>
<body>
  <h2>Test Login</h2>
  <div>
    <label>Username: <input id="username" value="admin" /></label>
  </div>
  <div>
    <label>Password: <input id="password" type="password" value="Admin123456!" /></label>
  </div>
  <button onclick="login()">Login</button>
  <pre id="result"></pre>
</body>
</html>
